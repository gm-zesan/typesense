services:
  typesense:
    image: typesense/typesense:29.0
    container_name: typesense
    restart: unless-stopped
    ports:
      - "${TYPESENSE_BIND_ADDRESS:-127.0.0.1}:8108:8108"
    volumes:
      - ./data:/data
    command: >
      --data-dir /data
      --api-key=m_JSgPavO2LV4XR0iDxE5BzHxfq4Xym52BPQrNnsd2Y
      --enable-cors
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:7474:7474" # HTTP Browser & Cypher REST API
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:7687:7687" # Bolt Protocol (Graphiti / Neo4j driver)
    environment:
      - NEO4J_AUTH=neo4j/secret1234
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_internal_dbms_tx__log_fail__on__corrupted__log__files=false
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s