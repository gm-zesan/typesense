services:
  typesense:
    image: typesense/typesense:29.0
    container_name: typesense

    restart: unless-stopped

    ports:
      - "8108:8108"

    volumes:
      - ./data:/data

    command: >
      --data-dir /data
      --api-key=m_JSgPavO2LV4XR0iDxE5BzHxfq4Xym52BPQrNnsd2Y
      --enable-cors

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3